version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidevops-postgres
    restart: always
    environment:
      POSTGRES_DB: aidevops
      POSTGRES_USER: aidevops
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidevops -d aidevops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
