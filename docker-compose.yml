version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidevops-postgres
    restart: always
    environment:
      POSTGRES_DB: aidevops
      POSTGRES_USER: aidevops
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidevops -d aidevops"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aidevops-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_API_KEY=devops-ai-secret-key-2026
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
    volumes:
      - chroma_data:/app/data/chroma_db
      - ./ai-service/docs-source:/app/docs-source:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
